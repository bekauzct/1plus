[project]
name = "obyektivka"
version = "0.1.0"
description = "Obyektivka (ma'lumotnoma) ni online to'ldirish: preview, PDF va DOCX"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.1,<6",
    "pydantic>=2.8,<3",
    "weasyprint>=62",
    "python-docx>=1.1",
    "pillow>=10.4",
    "django-ratelimit>=4.1",
    "whitenoise>=6.7",
    "gunicorn>=23",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
    "pypdf>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "django-stubs[compatible-mypy]>=5.0",
    "pre-commit>=3.8",
    "playwright>=1.47",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
addopts = "-ra"
markers = ["e2e: brauzer orqali end-to-end testlar (playwright)"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["static/vendor", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "pydantic.mypy"]
strict_optional = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["tests/", "e2e/"]

[tool.django-stubs]
django_settings_module = "config.settings"
