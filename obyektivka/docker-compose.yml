# Lokal production-ga yaqin ishga tushirish:
#   docker compose up --build                 -> http://localhost:8000
#   docker compose --profile proxy up --build -> nginx bilan http://localhost:8080
services:
  web:
    build: .
    image: obyektivka:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-production}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,web}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8000,http://localhost:8080}
      DJANGO_SECURE_COOKIES: ${DJANGO_SECURE_COOKIES:-0}
      SITE_URL: ${SITE_URL:-http://localhost:8000}
      REDIS_URL: redis://redis:6379/0
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-1}
      SQLITE_PATH: /app/data/db.sqlite3
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-3}
    ports:
      # Serverda faqat ichkariga: WEB_PORT=127.0.0.1:8000 (.env)
      - "${WEB_PORT:-8000}:8000"
    volumes:
      - sqlite:/app/data
    depends_on:
      - redis
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]

  nginx:
    image: nginx:1.27-alpine
    profiles: ["proxy"]
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/proxy_params_obv:/etc/nginx/proxy_params_obv:ro
    depends_on:
      - web

volumes:
  sqlite:
