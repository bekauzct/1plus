# Nginx reverse proxy (VPS). docker-compose --profile proxy bilan ishlaydi.
# TLS: certbot yoki Cloudflare. Quyida 80-port; 443 uchun README'ga qarang.
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

log_format nobody '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log nobody;

    client_max_body_size 6m;          # ilova 5 MB dan kattasini 413 bilan rad etadi
    client_body_buffer_size 6m;       # body diskdagi vaqtinchalik faylga tushmasin
    proxy_request_buffering on;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;

    location /api/ {
        limit_req zone=api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://web:8000;
        include /etc/nginx/proxy_params_obv;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://web:8000;
        include /etc/nginx/proxy_params_obv;
    }
}
