# obyektivka/ loyihasi uchun. O'rnatish: cd obyektivka && uv run pre-commit install (repo ildizida ishlaydi)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        files: ^obyektivka/
        exclude: ^obyektivka/(tests/fixtures/|static/vendor/|static/css/app\.css)
      - id: end-of-file-fixer
        files: ^obyektivka/
        exclude: ^obyektivka/(tests/fixtures/|static/vendor/|static/css/app\.css)
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=800"]
  # ruff/mypy loyihaning o'z versiyasi bilan (uv.lock) ishlaydi
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: bash -c 'cd obyektivka && uv run ruff check --fix .'
        language: system
        pass_filenames: false
        files: ^obyektivka/.*\.py$
      - id: ruff-format
        name: ruff format
        entry: bash -c 'cd obyektivka && uv run ruff format .'
        language: system
        pass_filenames: false
        files: ^obyektivka/.*\.py$
      - id: mypy
        name: mypy
        entry: bash -c 'cd obyektivka && uv run mypy apps config'
        language: system
        pass_filenames: false
        files: ^obyektivka/.*\.py$
