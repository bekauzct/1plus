repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^obyektivka/(tests/fixtures/|static/vendor/)
      - id: end-of-file-fixer
        exclude: ^obyektivka/(tests/fixtures/|static/vendor/)
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=800"]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
        files: ^obyektivka/
      - id: ruff-format
        files: ^obyektivka/
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: bash -c 'cd obyektivka && uv run mypy apps config'
        language: system
        pass_filenames: false
        files: ^obyektivka/.*\.py$
